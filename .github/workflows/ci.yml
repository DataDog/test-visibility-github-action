name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-install-retries:
    name: Install Retry Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Test Install Retries
        run: python3 scripts/test-install-retries.py

  test-java-action:
    name: Java Smoke Test
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Instrumentation Action
        id: test-action
        uses: ./
        with:
          languages: java
          api_key: "dummy"
          java-instrumented-build-system: "all"

      - name: Check If Java Tracing Works
        run: |
          LOG_FILE=java-output.log
          TRACER_INIT_LOG="CI Visibility settings"
          
          java -version 2>&1 | tee $LOG_FILE
          grep -q "$TRACER_INIT_LOG" $LOG_FILE || { echo "Error: Output does not contain tracer initialisation log: $TRACER_INIT_LOG"; exit 1; }

  # The action with installer v16 puts ddtest's go command first on PATH for
  # the job's next steps; go test then runs through ddtest instrument.
  test-go-action-matrix:
    name: Go Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default inputs, ubuntu
            os: ubuntu-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: default inputs, macos
            os: macos-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: default inputs, windows
            os: windows-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: go-tracer-version latest
            os: ubuntu-latest
            runner_go: stable
            layout: root
            go_tracer_version: latest
            expect_instrumented: true
            expected_ddtest_version: latest
          # An Orchestrion version names no ddtest release: the latest is installed.
          - name: earlier Orchestrion pin
            os: ubuntu-latest
            runner_go: stable
            layout: root
            go_tracer_version: v1.8.0
            expect_instrumented: true
            expected_ddtest_version: latest
          # Two modules below the root, with the deprecated go-module-dir naming one.
          - name: multiple modules with go-module-dir
            os: ubuntu-latest
            runner_go: stable
            layout: multiple_modules
            go_module_dir: ./go-smoke/services/payments
            expect_instrumented: true
            expected_ddtest_version: default
          # ddtest needs Go 1.25: the action skips Go with a warning and succeeds.
          - name: runner go1.24 skip
            os: ubuntu-latest
            runner_go: '1.24'
            layout: root
            expect_instrumented: false
            expected_ddtest_version: ''
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.runner_go }}
          cache: false

      - name: Create Go Scenario
        run: |
          set -euo pipefail

          # The go directive is older than the runner's Go: ddtest builds with
          # the runner's toolchain and leaves go.mod as it is. SMOKE_FAIL makes
          # the test fail.
          create_module() {
            local module_dir="$1"
            local package_name="$2"

            mkdir -p "$module_dir"
            printf 'module example.com/smoke/%s\n\ngo 1.22\n' "$package_name" > "$module_dir/go.mod"
            cat > "$module_dir/smoke_test.go" <<EOF
          package $package_name

          import (
          	"os"
          	"testing"
          )

          func TestSmoke(t *testing.T) {
          	if os.Getenv("SMOKE_FAIL") == "1" {
          		t.Fatal("SMOKE_FAIL is set")
          	}
          }
          EOF
          }

          modules=()
          case "${{ matrix.layout }}" in
            root)
              modules=(go-smoke)
              ;;
            multiple_modules)
              modules=(go-smoke/services/payments go-smoke/services/orders)
              ;;
            *)
              echo "Error: Unknown layout '${{ matrix.layout }}'."
              exit 1
              ;;
          esac
          for module_dir in "${modules[@]}"; do
            # A package name has no hyphen.
            create_module "$module_dir" "$(basename "$module_dir" | tr -d -)"
          done
          printf '%s\n' "${modules[@]}" > go-smoke.modules
          cp -R go-smoke go-smoke.before
          # The toolchain's go, before the action puts ddtest's first on PATH.
          command -v go > toolchain-go.path

      # An input set to an empty string is not its default, so each set of
      # inputs has its own step.
      - name: Run Instrumentation Action
        if: ${{ !matrix.go_tracer_version && !matrix.go_module_dir }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"

      - name: Run Instrumentation Action (go-tracer-version)
        if: ${{ matrix.go_tracer_version }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"
          go-tracer-version: ${{ matrix.go_tracer_version }}
          cache: false

      - name: Run Instrumentation Action (go-module-dir)
        if: ${{ matrix.go_module_dir }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"
          go-module-dir: ${{ matrix.go_module_dir }}
          cache: false

      - name: Run Go Tests in the Next Step
        env:
          EXPECT_INSTRUMENTED: ${{ matrix.expect_instrumented }}
          EXPECTED_DDTEST_VERSION: ${{ matrix.expected_ddtest_version }}
          # Nothing listens there; test-go-reporting.sh points its own run at
          # its intake. The dummy API key reaches no Datadog site.
          DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail

          go_path="$(command -v go)"
          toolchain_go_path="$(cat toolchain-go.path)"
          echo "go: $go_path (before the action: $toolchain_go_path)"

          if [ "$EXPECT_INSTRUMENTED" = "true" ]; then
            reporting=reported
            [ "$go_path" != "$toolchain_go_path" ] || { echo "Error: go is still the toolchain's, $go_path, not ddtest's go command."; exit 1; }
            expected_version="$EXPECTED_DDTEST_VERSION"
            if [ "$expected_version" = "default" ]; then
              expected_version="$(awk '/^  go-tracer-version:/ { input = 1 } input && /^    default:/ { gsub(/[ \047\r]/, "", $2); print $2; exit }' action.yml)"
            elif [ "$expected_version" = "latest" ]; then
              # GitHub redirects releases/latest to the newest release's tag.
              expected_version="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/DataDog/ddtest/releases/latest)"
              expected_version="${expected_version##*/}"
            fi
            [ "${DD_TRACER_VERSION_GO:-}" = "$expected_version" ] || { echo "Error: ddtest ${DD_TRACER_VERSION_GO:-?} was installed, not $expected_version."; exit 1; }
          else
            reporting=unreported
            [ "$go_path" = "$toolchain_go_path" ] || { echo "Error: go is $go_path, not the toolchain's $toolchain_go_path, though Go was skipped."; exit 1; }
            [ -z "${DD_TRACER_VERSION_GO:-}" ] || { echo "Error: Expected DD_TRACER_VERSION_GO to be unset, got '$DD_TRACER_VERSION_GO'."; exit 1; }
          fi

          while IFS= read -r module_dir; do
            # go test passes, and its test's event reaches the intake only
            # when ddtest instruments it.
            scripts/test-go-reporting.sh "$module_dir" TestSmoke "$reporting"

            log="$PWD/go-smoke.log"
            if (cd "$module_dir" && SMOKE_FAIL=1 go test -count=1 ./...) > "$log" 2>&1; then
              cat "$log"
              echo "Error: A failing test must fail go test in $module_dir."
              exit 1
            fi
          done < go-smoke.modules

          # go test leaves the projects' files, go.mod included, as they were.
          diff -r go-smoke.before go-smoke || { echo "Error: go test changed the projects' files."; exit 1; }

  # The first job saves the action's Go cache and the second, on a new runner,
  # restores it: go test then finds the project's module without a proxy. The
  # run's id in go.mod gives each run its own cache key, so the second job
  # restores only what the first saved. The second job takes the module path
  # and the Go version, both part of the key, from the first, so it finds that
  # cache also when only the second job is rerun.
  test-go-action-cache-save:
    name: Go Cache (save)
    runs-on: ubuntu-latest
    outputs:
      module-path: ${{ steps.project.outputs.module-path }}
      go-version: ${{ steps.project.outputs.go-version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false

      - name: Create Go Project
        id: project
        env:
          MODULE_PATH: example.com/cache/r${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          scripts/create-go-cache-project.sh
          echo "module-path=$MODULE_PATH" >> "$GITHUB_OUTPUT"
          go_version="$(go env GOVERSION)"
          echo "go-version=${go_version#go}" >> "$GITHUB_OUTPUT"

      - name: Run Instrumentation Action
        uses: ./
        with:
          languages: go
          api_key: "dummy"

      - name: Download the Project's Module
        run: |
          set -euo pipefail
          (cd go-cache && go mod download)
          [ -d "$(go env GOMODCACHE)/github.com/google/go-cmp@v0.7.0" ] || { echo "Error: go-cmp is not in GOMODCACHE."; exit 1; }

  test-go-action-cache-restore:
    name: Go Cache (restore)
    needs: test-go-action-cache-save
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ needs.test-go-action-cache-save.outputs.go-version }}
          cache: false

      - name: Create Go Project
        env:
          MODULE_PATH: ${{ needs.test-go-action-cache-save.outputs.module-path }}
        run: |
          set -euo pipefail
          [ -n "$MODULE_PATH" ] || { echo "Error: The save job published no module path."; exit 1; }
          scripts/create-go-cache-project.sh
          [ ! -e "$(go env GOMODCACHE)/github.com/google/go-cmp@v0.7.0" ] || { echo "Error: go-cmp is in GOMODCACHE before the action restored its cache."; exit 1; }
          command -v go > toolchain-go.path

      - name: Run Instrumentation Action
        uses: ./
        with:
          languages: go
          api_key: "dummy"

      - name: Run Go Tests with the Restored Cache
        env:
          # Only the restored GOMODCACHE can provide go-cmp.
          GOPROXY: "off"
        run: |
          set -euo pipefail
          [ "$(command -v go)" != "$(cat toolchain-go.path)" ] || { echo "Error: go is still the toolchain's, not ddtest's go command."; exit 1; }
          scripts/test-go-reporting.sh go-cache TestCache reported

  # The action with installer v17 sets RUSTC_WORKSPACE_WRAPPER for the job's
  # next steps; cargo test then reports through dd-test-wrapper. Windows has no
  # dd-test-rs release, so the action there skips Rust with a warning.
  test-rust-action-matrix:
    name: Rust Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default inputs, ubuntu
            os: ubuntu-latest
            expect_action_failure: false
            expect_instrumented: true
            expected_version: default
          - name: default inputs, macos
            os: macos-latest
            expect_action_failure: false
            expect_instrumented: true
            expected_version: default
          - name: rust-tracer-version latest
            os: ubuntu-latest
            expect_action_failure: false
            rust_tracer_version: latest
            expect_instrumented: true
            expected_version: latest
          # dd-test-rs needs Rust 1.81: the action fails when Rust is requested.
          - name: rust 1.80 failure
            os: ubuntu-latest
            rust_toolchain: '1.80.0'
            expect_action_failure: true
            expect_instrumented: false
            expected_version: ''
          - name: default inputs, windows
            os: windows-latest
            expect_action_failure: false
            expect_instrumented: false
            expected_version: ''
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Rust Below the Minimum
        if: ${{ matrix.rust_toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.rust_toolchain }}" --profile minimal
          rustup default "${{ matrix.rust_toolchain }}"
          rustc --version | grep -q "^rustc ${{ matrix.rust_toolchain }} " || { echo "Error: rustc is not ${{ matrix.rust_toolchain }}."; exit 1; }

      - name: Create Rust Scenario
        run: |
          set -euo pipefail

          # SMOKE_FAIL makes the test fail.
          mkdir -p rust-smoke/tests
          printf '[package]\nname = "smoke"\nversion = "0.0.0"\nedition = "2021"\n' > rust-smoke/Cargo.toml
          cat > rust-smoke/tests/smoke.rs <<'EOF'
          #[test]
          fn test_smoke() {
              assert!(std::env::var("SMOKE_FAIL").as_deref() != Ok("1"), "SMOKE_FAIL is set");
          }
          EOF

      # An input set to an empty string is not its default, so each set of
      # inputs has its own step.
      - name: Run Instrumentation Action
        if: ${{ !matrix.rust_tracer_version }}
        id: run-action
        continue-on-error: ${{ matrix.expect_action_failure }}
        uses: ./
        with:
          languages: rust
          api_key: "dummy"

      - name: Run Instrumentation Action (rust-tracer-version)
        if: ${{ matrix.rust_tracer_version }}
        id: run-action-version
        uses: ./
        with:
          languages: rust
          api_key: "dummy"
          rust-tracer-version: ${{ matrix.rust_tracer_version }}

      - name: Run Rust Tests in the Next Step
        env:
          EXPECT_INSTRUMENTED: ${{ matrix.expect_instrumented }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
          EXPECTED_OUTCOME: ${{ matrix.expect_action_failure && 'failure' || 'success' }}
          # Nothing listens there; test-rust-reporting.sh points its own run at
          # its intake. The dummy API key reaches no Datadog site.
          DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail

          action_outcome="${{ matrix.rust_tracer_version && steps.run-action-version.outcome || steps.run-action.outcome }}"
          echo "The action finished with $action_outcome."
          [ "$action_outcome" = "$EXPECTED_OUTCOME" ] || { echo "Error: Expected the action to end with $EXPECTED_OUTCOME."; exit 1; }

          if [ "$EXPECT_INSTRUMENTED" = "true" ]; then
            reporting=reported
            expected_version="$EXPECTED_VERSION"
            if [ "$expected_version" = "default" ]; then
              expected_version="$(awk '/^  rust-tracer-version:/ { input = 1 } input && /^    default:/ { gsub(/[ \047\r]/, "", $2); print $2; exit }' action.yml)"
            elif [ "$expected_version" = "latest" ]; then
              # GitHub redirects releases/latest to the newest release's tag.
              expected_version="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/DataDog/dd-test-rs/releases/latest)"
              expected_version="${expected_version##*/}"
            fi
            echo "RUSTC_WORKSPACE_WRAPPER: ${RUSTC_WORKSPACE_WRAPPER:-}"
            [ -n "${RUSTC_WORKSPACE_WRAPPER:-}" ] || { echo "Error: RUSTC_WORKSPACE_WRAPPER was not set."; exit 1; }
            case "$RUSTC_WORKSPACE_WRAPPER" in
              /*|[A-Za-z]:/*) ;;
              *) echo "Error: RUSTC_WORKSPACE_WRAPPER is not an absolute path."; exit 1 ;;
            esac
            case "$RUSTC_WORKSPACE_WRAPPER" in
              */.datadog/dd-test-wrapper) ;;
              *) echo "Error: RUSTC_WORKSPACE_WRAPPER is not the wrapper the action installed."; exit 1 ;;
            esac
            [ -x "$RUSTC_WORKSPACE_WRAPPER" ] || { echo "Error: $RUSTC_WORKSPACE_WRAPPER is not executable."; exit 1; }
            [ "${DD_TRACER_VERSION_RUST:-}" = "$expected_version" ] || { echo "Error: dd-test-rs ${DD_TRACER_VERSION_RUST:-?} was installed, not $expected_version."; exit 1; }
          else
            reporting=unreported
            [ -z "${RUSTC_WORKSPACE_WRAPPER:-}" ] || { echo "Error: Expected RUSTC_WORKSPACE_WRAPPER to be unset, got '$RUSTC_WORKSPACE_WRAPPER'."; exit 1; }
            [ -z "${DD_TRACER_VERSION_RUST:-}" ] || { echo "Error: Expected DD_TRACER_VERSION_RUST to be unset, got '$DD_TRACER_VERSION_RUST'."; exit 1; }
          fi

          # cargo test passes, and its test's event reaches the intake only
          # when the wrapper instruments it.
          scripts/test-rust-reporting.sh rust-smoke test_smoke "$reporting"

          log="$PWD/rust-smoke.log"
          if (cd rust-smoke && SMOKE_FAIL=1 cargo test) > "$log" 2>&1; then
            cat "$log"
            echo "Error: A failing test must fail cargo test."
            exit 1
          fi

  # create-library-version-bump-pr.sh reads the latest library release and hands
  # it to bump-library-versions.sh, which edits only that library's default in
  # action.yml and its README row.
  test-library-version-bump:
    name: Library Version Bump (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go
            library: go
            input: go-tracer-version
            releases: DataDog/ddtest
            test_version: v1.99.0
          - name: Rust
            library: rust
            input: rust-tracer-version
            releases: DataDog/dd-test-rs
            test_version: v9.9.9
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Bump ${{ matrix.name }} to the Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ matrix.input }}
          LIBRARY: ${{ matrix.library }}
          RELEASES: ${{ matrix.releases }}
          TEST_VERSION: ${{ matrix.test_version }}
        run: |
          set -euo pipefail

          default_of() {
            awk -v input="$INPUT" '$0 == "  " input ":" { input_seen = 1 } input_seen && /^    default:/ { gsub(/[ \047\r]/, "", $2); print $2; exit }' action.yml
          }
          readme_default() {
            awk -F '|' -v input="$INPUT" '$2 ~ ("^ " input " ") { gsub(/ /, "", $5); print $5 }' README.md
          }

          # The query that the bump PR script runs.
          latest_query=$(grep "^latest_$LIBRARY=" scripts/create-library-version-bump-pr.sh)
          eval "$latest_query"
          latest_variable="latest_$LIBRARY"
          latest="${!latest_variable}"
          echo "Latest release from the bump script's query: $latest"
          # GitHub redirects releases/latest to the newest release's tag.
          latest_release="$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$RELEASES/releases/latest")"
          latest_release="${latest_release##*/}"
          [ "$latest" = "$latest_release" ] || { echo "Error: The bump script's query returned $latest, not the latest $RELEASES release $latest_release."; exit 1; }

          for version in "$TEST_VERSION" "$latest"; do
            git checkout -- action.yml README.md
            scripts/bump-library-versions.sh "--$LIBRARY" "$version"
            [ "$(default_of)" = "$version" ] || { echo "Error: action.yml defaults to $(default_of), not $version."; exit 1; }
            [ "$(readme_default)" = "$version" ] || { echo "Error: README.md defaults to $(readme_default), not $version."; exit 1; }
            changed=$(git diff --name-only | tr '\n' ' ')
            if [ "$version" = "$latest" ] && [ -z "$changed" ]; then
              continue
            fi
            [ "$changed" = "README.md action.yml " ] || { echo "Error: The bump changed: $changed"; exit 1; }
            [ "$(git diff --numstat | awk '{ added += $1; removed += $2 } END { print added, removed }')" = "2 2" ] || { git diff; echo "Error: The bump changed more than the two defaults."; exit 1; }
          done
