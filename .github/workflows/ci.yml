name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-install-retries:
    name: Install Retry Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Test Install Retries
        run: python3 scripts/test-install-retries.py

  test-java-action:
    name: Java Smoke Test
    runs-on: ubuntu-latest
    container:
      image: adoptopenjdk/openjdk11:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Instrumentation Action
        id: test-action
        uses: ./
        with:
          languages: java
          api_key: "dummy"
          java-instrumented-build-system: "all"

      - name: Check If Java Tracing Works
        run: |
          LOG_FILE=java-output.log
          TRACER_INIT_LOG="CI Visibility settings"
          
          java -version 2>&1 | tee $LOG_FILE
          grep -q "$TRACER_INIT_LOG" $LOG_FILE || { echo "Error: Output does not contain tracer initialisation log: $TRACER_INIT_LOG"; exit 1; }

  # The action with installer v16 puts ddtest's go command first on PATH for
  # the job's next steps; go test then runs through ddtest instrument.
  test-go-action-matrix:
    name: Go Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default inputs, ubuntu
            os: ubuntu-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: default inputs, macos
            os: macos-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: default inputs, windows
            os: windows-latest
            runner_go: stable
            layout: root
            expect_instrumented: true
            expected_ddtest_version: default
          - name: go-tracer-version latest
            os: ubuntu-latest
            runner_go: stable
            layout: root
            go_tracer_version: latest
            expect_instrumented: true
            expected_ddtest_version: latest
          # An Orchestrion version names no ddtest release: the latest is installed.
          - name: earlier Orchestrion pin
            os: ubuntu-latest
            runner_go: stable
            layout: root
            go_tracer_version: v1.8.0
            expect_instrumented: true
            expected_ddtest_version: latest
          # Two modules below the root, with the deprecated go-module-dir naming one.
          - name: multiple modules with go-module-dir
            os: ubuntu-latest
            runner_go: stable
            layout: multiple_modules
            go_module_dir: ./services/payments
            expect_instrumented: true
            expected_ddtest_version: default
          # ddtest needs Go 1.25: the action skips Go with a warning and succeeds.
          - name: runner go1.24 skip
            os: ubuntu-latest
            runner_go: '1.24'
            layout: root
            expect_instrumented: false
            expected_ddtest_version: ''
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.runner_go }}
          cache: false

      - name: Create Go Scenario
        run: |
          set -euo pipefail

          # The go directive is older than the runner's Go: ddtest builds with
          # the runner's toolchain and leaves go.mod as it is. SMOKE_FAIL makes
          # the test fail.
          create_module() {
            local module_dir="$1"
            local package_name="$2"

            mkdir -p "$module_dir"
            printf 'module example.com/smoke/%s\n\ngo 1.22\n' "$package_name" > "$module_dir/go.mod"
            cat > "$module_dir/smoke_test.go" <<EOF
          package $package_name

          import (
          	"os"
          	"testing"
          )

          func TestSmoke(t *testing.T) {
          	if os.Getenv("SMOKE_FAIL") == "1" {
          		t.Fatal("SMOKE_FAIL is set")
          	}
          }
          EOF
          }

          modules=()
          case "${{ matrix.layout }}" in
            root)
              modules=(go-smoke)
              ;;
            multiple_modules)
              modules=(go-smoke/services/payments go-smoke/services/orders)
              ;;
            *)
              echo "Error: Unknown layout '${{ matrix.layout }}'."
              exit 1
              ;;
          esac
          for module_dir in "${modules[@]}"; do
            # A package name has no hyphen.
            create_module "$module_dir" "$(basename "$module_dir" | tr -d -)"
          done
          printf '%s\n' "${modules[@]}" > go-smoke.modules
          cp -R go-smoke go-smoke.before

      # An input set to an empty string is not its default, so each set of
      # inputs has its own step.
      - name: Run Instrumentation Action
        if: ${{ !matrix.go_tracer_version && !matrix.go_module_dir }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"

      - name: Run Instrumentation Action (go-tracer-version)
        if: ${{ matrix.go_tracer_version }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"
          go-tracer-version: ${{ matrix.go_tracer_version }}
          cache: false

      - name: Run Instrumentation Action (go-module-dir)
        if: ${{ matrix.go_module_dir }}
        uses: ./
        with:
          languages: go
          api_key: "dummy"
          go-module-dir: ${{ matrix.go_module_dir }}
          cache: false

      - name: Run Go Tests in the Next Step
        env:
          EXPECT_INSTRUMENTED: ${{ matrix.expect_instrumented }}
          EXPECTED_DDTEST_VERSION: ${{ matrix.expected_ddtest_version }}
          # Nothing listens there: the tests need no intake, and the dummy API
          # key reaches no Datadog site.
          DD_CIVISIBILITY_AGENTLESS_URL: http://127.0.0.1:9
          DD_TRACE_DEBUG: "true"
        run: |
          set -euo pipefail

          go_path="$(command -v go)"
          echo "go: $go_path"

          if [ "$EXPECT_INSTRUMENTED" = "true" ]; then
            [[ "$go_path" == *go-shim* ]] || { echo "Error: go is $go_path, not ddtest's go command."; exit 1; }
            expected_version="$EXPECTED_DDTEST_VERSION"
            if [ "$expected_version" = "default" ]; then
              expected_version="$(awk '/^  go-tracer-version:/ { input = 1 } input && /^    default:/ { gsub(/[ \047\r]/, "", $2); print $2; exit }' action.yml)"
            elif [ "$expected_version" = "latest" ]; then
              # GitHub redirects releases/latest to the newest release's tag.
              expected_version="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/DataDog/ddtest/releases/latest)"
              expected_version="${expected_version##*/}"
            fi
            [ "${DD_TRACER_VERSION_GO:-}" = "$expected_version" ] || { echo "Error: ddtest ${DD_TRACER_VERSION_GO:-?} was installed, not $expected_version."; exit 1; }
          else
            [[ "$go_path" != *go-shim* ]] || { echo "Error: go is ddtest's go command, $go_path, though Go was skipped."; exit 1; }
            [ -z "${DD_TRACER_VERSION_GO:-}" ] || { echo "Error: Expected DD_TRACER_VERSION_GO to be unset, got '$DD_TRACER_VERSION_GO'."; exit 1; }
          fi

          while IFS= read -r module_dir; do
            log="$PWD/go-smoke.log"
            if ! (cd "$module_dir" && go test -count=1 -v ./...) > "$log" 2>&1; then
              cat "$log"
              echo "Error: go test failed in $module_dir."
              exit 1
            fi
            cat "$log"
            # ddtest's debug output: the build was planned with Test
            # Optimization and the test function ran instrumented.
            for marker in "plan ready" "instrumentTestingTFunc: instrumenting test function"; do
              if [ "$EXPECT_INSTRUMENTED" = "true" ]; then
                grep -Fq "$marker" "$log" || { echo "Error: go test in $module_dir did not run through ddtest instrument ('$marker' missing)."; exit 1; }
              else
                ! grep -Fq "$marker" "$log" || { echo "Error: go test in $module_dir ran through ddtest instrument, though Go was skipped."; exit 1; }
              fi
            done

            if (cd "$module_dir" && SMOKE_FAIL=1 go test -count=1 ./...) > "$log" 2>&1; then
              cat "$log"
              echo "Error: A failing test must fail go test in $module_dir."
              exit 1
            fi
          done < go-smoke.modules

          # go test leaves the projects' files, go.mod included, as they were.
          diff -r go-smoke.before go-smoke || { echo "Error: go test changed the projects' files."; exit 1; }
